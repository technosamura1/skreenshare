[package]
name = "screenshare"
version = "0.12.10"
edition = "2021"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
arboard = { version = "3", default-features = false }
base64 = "0.22"
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }
getrandom = "0.3"
raw-window-handle = "0.6"
softbuffer = "0.4"
socket2 = "0.6"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-core = "0.62"
windows-numerics = "0.3"
winit = "0.30"
zstd = "0.14"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
chacha20poly1305 = "0.11.0"

[build-dependencies]
zstd = "0.14"
cc = "1"
sha2 = "0.11"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Metadata",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
debug = "line-tables-only"
