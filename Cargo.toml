[package]
name = "screenshare"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
base64 = "0.22"
cpal = "0.18"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }
getrandom = "0.3"
softbuffer = "0.4"
socket2 = "0.6"
winit = "0.30"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = 3
debug = "line-tables-only"
