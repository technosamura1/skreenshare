[package]
name = "skreenshare-proektor"
version = "0.4.0"
edition = "2021"

[dependencies]
anyhow = "1"
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }
getrandom = "0.3"
if-addrs = "0.13"
mdns-sd = "0.13"
proto = { path = "proto" }
socket2 = "0.6"
windows-core = "0.62"
zstd = "0.14"

[workspace]
members = ["proto"]

[build-dependencies]
zstd = "0.14"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
debug = "line-tables-only"
