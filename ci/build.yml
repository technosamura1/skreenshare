# Заготовка GitHub Actions (НЕ проверена). Чтобы включить: скопируйте в .github/workflows/build.yml.
# Для пуша в .github/workflows токену нужен scope "workflow" (gh auth refresh -s workflow).
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg (LGPL shared) + import libs
        shell: bash
        run: |
          mkdir -p third_party && cd third_party
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          unzip -q ffmpeg.zip && mv ffmpeg-n9.0-latest-win64-lgpl-shared-9.0 ffmpeg
      - name: MSVC import libs
        shell: pwsh
        run: ./tools/make-import-libs.ps1
      - run: cargo build --release
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: target/release/skreenshare-proektor.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd android && ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android/app/build/outputs/apk/release/app-release.apk }
